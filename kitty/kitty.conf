font_family      JetBrains Mono NL Light
font_size        16

allow_remote_control yes

# cursor_trail 1
# cursor_trail_decay 0.1 0.3

tab_bar_style separator
tab_separator "  │  "

tab_bar_background #1a1a1a
tab_bar_margin_color #1a1a1a

# Active
active_tab_foreground #c4a574
active_tab_background #1a1a1a
active_tab_font_style bold

# Inactive
inactive_tab_foreground #8a7f72
inactive_tab_background #1a1a1a
inactive_tab_font_style normal

active_tab_font_style bold

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

include yami-colors.conf
